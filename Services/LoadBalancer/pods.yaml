apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-1
  namespace: nginx-lb
  labels:
    app: nginx
spec:
  containers:
  - name: nginx-container-1
    image: nginx:alpine
    ports:
    - containerPort: 80

