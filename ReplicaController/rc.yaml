apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-rc-controller
  namespace: replication-controller
spec:
  replicas: 3
  selector:
    app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx:alpine
        ports:
        - containerPort: 80
